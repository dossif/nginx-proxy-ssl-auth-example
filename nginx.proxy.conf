#
# nginx proxy
#

server {
    listen 443 ssl;

    # tls: server cert
    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;

    # mtls: client cert for webserver
    proxy_ssl_certificate     /etc/nginx/certs/mtls-proxy.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/mtls-proxy.key;

    # mtls: validate webserver
    proxy_ssl_trusted_certificate /etc/nginx/certs/webserver-ca.crt;
    proxy_ssl_verify on;

    location / {
        proxy_pass https://webserver:443;
    }
}

# end
