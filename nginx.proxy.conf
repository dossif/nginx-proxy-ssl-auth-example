#
# nginx proxy
#

server {
    listen 443 ssl;

    # https://nginx.org/en/docs/http/ngx_http_ssl_module.html
    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;

    location / {
        proxy_pass https://webserver:443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # https://nginx.org/en/docs/http/ngx_http_proxy_module.html
        proxy_ssl_certificate     /etc/nginx/certs/proxy-client.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/proxy-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/webserver.crt;
        proxy_ssl_verify on;
        proxy_ssl_name webserver;
    }
}

# end
