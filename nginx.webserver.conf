#
# nginx webserver
#

server {
    listen 443 ssl;

    # tls: server cert
    ssl_certificate     /etc/nginx/certs/webserver.crt;
    ssl_certificate_key /etc/nginx/certs/webserver.key;

    # mtls: validate proxy
    ssl_client_certificate /etc/nginx/certs/mtls-ca.crt;
    ssl_verify_client on;

    location / {
        index index.html;
        root /var/www/html;
    }
}

# end
