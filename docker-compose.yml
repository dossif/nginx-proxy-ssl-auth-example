#
# nginx webserver and nginx proxy
#
name: nginx-webserver-proxy
services:
  webserver:
    container_name: nginx_webserver
    image: nginx
    volumes:
      - ./nginx.index.html:/var/www/html/index.html
      - ./nginx.webserver.conf:/etc/nginx/conf.d/default.conf
      - ./webserver.crt:/etc/nginx/certs/webserver.crt:ro
      - ./webserver.key:/etc/nginx/certs/webserver.key:ro
      - ./client-ca.crt:/etc/nginx/certs/client-ca.crt:ro
    ports:
      - 8443:443
    restart: unless-stopped
  proxy:
    container_name: nginx_proxy
    image: nginx
    volumes:
      - ./nginx.proxy.conf:/etc/nginx/conf.d/default.conf
      - ./proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ./proxy.key:/etc/nginx/certs/proxy.key:ro
      - ./proxy-client.crt:/etc/nginx/certs/proxy-client.crt:ro
      - ./proxy-client.key:/etc/nginx/certs/proxy-client.key:ro
      - ./webserver.crt:/etc/nginx/certs/webserver.crt:ro
    ports:
      - 9443:443
    restart: unless-stopped
    depends_on:
      - webserver

# end
